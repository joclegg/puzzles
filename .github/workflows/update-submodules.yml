name: Update submodules

on:
  repository_dispatch:
    types: [submodule-merged]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move every submodule to the latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git submodule update --init --remote --depth 1
          git add $(git config --file .gitmodules --get-regexp '\.path$' | cut -d' ' -f2)
          if git diff --cached --quiet; then
            echo "Already up to date"
            exit 0
          fi
          summary=$(git diff --cached --submodule=short | grep '^Submodule' | sed 's/^Submodule //')
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update submodules" -m "$summary"
          # main is protected, so the update goes in through a pull request.
          branch="update-submodules/${{ github.run_id }}"
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" --title "Update submodules" --body "$summary"
          gh pr merge "$branch" --merge --delete-branch
